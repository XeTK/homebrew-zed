# Mirrors this repo to github.com/XeTK/homebrew-zed so `brew tap xetk/zed`
# works without a URL and survives the homelab being down. Gitea is the source
# of truth: nothing is ever pulled back from GitHub, and the mirror is
# overwritten on every push.
#
# Uses a deploy key scoped to that one GitHub repo (secret MIRROR_DEPLOY_KEY).
# Gitea's built-in push mirrors would need a GitHub token and do not accept SSH
# remotes on this instance.
#
# Runs on linux-x86, not macos: this needs only git and ssh, and the single
# Mac runner is routinely occupied for an hour or more by Zed/Mixxx builds, which
# left the first mirror run queued behind them. Pushes over ssh.github.com:443
# because outbound :22 is not guaranteed from every runner; the same job is proven
# on linux-x86 for xetk/homebrew-mixxx.
name: mirror-to-github

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: mirror-to-github
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: linux-x86
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to GitHub
        env:
          MIRROR_DEPLOY_KEY: ${{ secrets.MIRROR_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [ -n "${MIRROR_DEPLOY_KEY}" ] || { echo "MIRROR_DEPLOY_KEY is not set"; exit 1; }
          umask 077
          key="$(mktemp)"; known_hosts="$(mktemp)"
          trap 'rm -f "${key}" "${known_hosts}"' EXIT
          printf '%s\n' "${MIRROR_DEPLOY_KEY}" > "${key}"
          # GitHub's host keys, fetched from its own API over TLS rather than scanned.
          curl -fsS https://api.github.com/meta | python3 -c \
            'import json,sys; [print("[ssh.github.com]:443 "+k) for k in json.load(sys.stdin)["ssh_keys"]]' > "${known_hosts}"
          [ -s "${known_hosts}" ] || { echo "could not fetch GitHub host keys"; exit 1; }
          export GIT_SSH_COMMAND="ssh -i ${key} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${known_hosts}"
          # Always push Gitea's main (not HEAD), so a manual run from another branch can
          # never publish that branch as the tap's main.
          git push --force "ssh://git@ssh.github.com:443/XeTK/homebrew-zed.git" "refs/remotes/origin/main:refs/heads/main"
          echo "mirrored $(git rev-parse --short origin/main) to github.com/XeTK/homebrew-zed"
